---
# /tmp is cleared by the Packer shell provisioner after Ansible exits,
# so doing it here causes Ansible's own module zip to be deleted mid-execution.
# - name: Remove contents of /tmp
#   shell: rm -rf /tmp/* /tmp/.[^.]* 2>/dev/null || true
#   changed_when: false

- name: Remove contents of /var/tmp
  ansible.builtin.shell: rm -rf /var/tmp/* /var/tmp/.[^.]* 2>/dev/null || true
  changed_when: false

- name: Clean apt cache (Debian/Ubuntu)
  ansible.builtin.apt:
    autoclean: true
    autoremove: true
  when: ansible_facts["os_family"] == "Debian"
  failed_when: false

- name: Clean zypper cache (openSUSE/SLES)
  ansible.builtin.command: zypper clean --all
  when: ansible_facts["os_family"] == "Suse" and ansible_facts["pkg_mgr"] == "zypper"
  changed_when: false
  failed_when: false

- name: Remove SSH host keys from known_hosts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.ssh/known_hosts
    - /home/*/.ssh/known_hosts
  failed_when: false
