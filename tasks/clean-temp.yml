---
- name: Remove contents of /tmp
  shell: rm -rf /tmp/* /tmp/.[^.]* 2>/dev/null || true
  changed_when: false

- name: Remove contents of /var/tmp
  shell: rm -rf /var/tmp/* /var/tmp/.[^.]* 2>/dev/null || true
  changed_when: false

- name: Clean apt cache (Debian/Ubuntu)
  apt:
    autoclean: yes
    autoremove: yes
  when: ansible_os_family == "Debian"
  ignore_errors: yes

- name: Clean zypper cache (openSUSE/SLES)
  command: zypper clean --all
  when: ansible_os_family == "Suse" and ansible_pkg_mgr == "zypper"
  changed_when: false
  ignore_errors: yes

- name: Remove SSH host keys from known_hosts
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /root/.ssh/known_hosts
    - /home/*/.ssh/known_hosts
  ignore_errors: yes
