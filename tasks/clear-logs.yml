---
- name: Find all log files
  ansible.builtin.find:
    paths: /var/log
    patterns: '*'
    recurse: true
    file_type: file
  register: log_files

- name: Truncate log files (preserve file structure)
  ansible.builtin.copy:
    content: ""
    dest: "{{ item.path }}"
    force: true
    mode: "0644"
  loop: "{{ log_files.files }}"
  failed_when: false

- name: Clear systemd journal
  ansible.builtin.command: journalctl --vacuum-time=1s
  when: ansible_facts["service_mgr"] == "systemd"
  changed_when: false
  failed_when: false

- name: Remove old log archives
  ansible.builtin.find:
    paths: /var/log
    patterns: '*.gz,*.1,*.2,*.old'
    recurse: true
  register: old_logs

- name: Delete old log archives
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_logs.files }}"
  failed_when: false
