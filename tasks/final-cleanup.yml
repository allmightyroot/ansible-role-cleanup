---
- name: Sync filesystem
  ansible.builtin.command: sync
  changed_when: false

- name: Clear kernel message buffer
  ansible.builtin.command: dmesg -c
  changed_when: false
  failed_when: false

- name: Remove Ansible facts
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: absent
  failed_when: false

- name: Final package cleanup (Debian/Ubuntu)
  ansible.builtin.apt:
    autoremove: true
    autoclean: true
  when: ansible_facts["os_family"] == "Debian"
  failed_when: false

- name: Display cleanup completion message
  ansible.builtin.debug:
    msg: "AMI cleanup complete - ready for snapshot"
