---
# tasks file for cleanup

- name: Clear log files
  ansible.builtin.include_tasks: clear-logs.yml

- name: Clean temporary files
  ansible.builtin.include_tasks: clean-temp.yml

- name: Set AMI metadata
  ansible.builtin.include_tasks: set-ami-metadata.yml

- name: Reset machine-id
  ansible.builtin.include_tasks: reset-machine-id.yml
  when: cleanup_reset_machine_id | bool

- name: Clear bash history
  ansible.builtin.include_tasks: clear-history.yml
  when: cleanup_clear_bash_history | bool

- name: Final cleanup tasks
  ansible.builtin.include_tasks: final-cleanup.yml
