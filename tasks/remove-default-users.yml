---
- name: Check if default cloud users exist
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
  loop: "{{ cleanup_cloud_users }}"
  register: user_check
  failed_when: false

- name: Check current SSH user
  ansible.builtin.command: whoami
  register: current_user
  changed_when: false

- name: Lock default cloud user accounts (except current user)
  ansible.builtin.user:
    name: "{{ item.item }}"
    password_lock: true
  loop: "{{ user_check.results }}"
  when:
    - item.ansible_facts is defined
    - item.item != current_user.stdout
  failed_when: false

- name: Remove sudo privileges from default cloud users
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/90-cloud-init-users
    state: absent
    regexp: "^{{ item }}"
  loop: "{{ cleanup_cloud_users }}"
  failed_when: false

- name: Clear authorized_keys for default cloud users (except current user)
  ansible.builtin.file:
    path: "/home/{{ item }}/.ssh/authorized_keys"
    state: absent
  loop: "{{ cleanup_cloud_users }}"
  when: item != current_user.stdout
  failed_when: false
