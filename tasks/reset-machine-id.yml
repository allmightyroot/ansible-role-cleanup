---
- name: Truncate machine-id (systemd)
  copy:
    content: ""
    dest: /etc/machine-id
    force: yes
  when: ansible_service_mgr == "systemd"

- name: Remove machine-id symlink
  file:
    path: /var/lib/dbus/machine-id
    state: absent
  ignore_errors: yes

- name: Create machine-id symlink to /etc/machine-id
  file:
    src: /etc/machine-id
    dest: /var/lib/dbus/machine-id
    state: link
  when: ansible_service_mgr == "systemd"
  ignore_errors: yes

- name: Reset cloud-init state
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/cloud/instance
    - /var/lib/cloud/instances
    - /var/log/cloud-init.log
    - /var/log/cloud-init-output.log
  ignore_errors: yes
